name: Validate Pull Request

# Runs on every PR that changes category/ or connections/ files.
# Commits NOTHING back (PRs can come from forks -> no write access).
# Only checks whether the submitted entries are valid JSON and match
# the schema.

on:
  pull_request:
    paths:
      - "category/**/*.json"
      - "connections/**/*.json"
      - "schemas/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate entries against schema
        run: python scripts/validate_entries.py

name: Process Knowledge

# Runs on every push to main that changes category/ or connections/
# files (e.g. when someone simply drops a new JSON file into a
# category/ subfolder and pushes), as well as manually via
# workflow_dispatch.
#
# Order (see scripts/run_all.py):
#   1. Assign IDs + rename files
#   2. Validate schema (aborts on errors, NO commit)
#   3. Duplicate check
#   4. Rebuild all meta/*.json indexes
#   5. Commit the result back

on:
  push:
    branches: [main]
    paths:
      - "category/**/*.json"
      - "connections/**/*.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: process-knowledge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run full pipeline (IDs, validation, duplicates, index)
        run: python scripts/run_all.py

      - name: Commit and push changes
        run: |
          git config user.name "alexandria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add category/ connections/ meta/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update IDs, index and duplicate check [skip ci]"
            git push
          fi
